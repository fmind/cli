# :schema https://mise.jdx.dev/schema/mise.json
# Docs: https://mise.jdx.dev/configuration.html

# Fail early on a mise older than the one CI pins (keep equal to setup-mise `version:`).
min_version = "2026.11.12"

[settings]
locked = true
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
minimum_release_age = "0d"

[settings.task]
run_auto_install = false
# Preserve child output; MISE_TASK_QUIET=false restores execution messages.
quiet = true

[task_config]
dir = "{{config_root}}"

[tools]
"aqua:astral-sh/uv" = "0.13.9"
betterleaks = "1.10.1"
dprint = "0.65.0"
jactionlint = { version = "2.6.0", workflow = "release.yaml" }
lefthook = "2.2.2"
python = "3.15.2"
shellcheck = "0.11.0"

[tasks.all]
alias = "a"
description = "Check, test, and build without rewriting source files — the single gate shared by hooks and CI"
run = ["mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build the wheel and source distribution"
sources = ["pyproject.toml", "README.md", "LICENSE", "src/**/*"]
outputs = ["dist/*.whl", "dist/*.tar.gz"]
run = "uv build --clear --no-sources"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no network (pre-commit)"
depends = ["check:actions", "check:deps", "check:format", "check:leaks", "check:lint", "check:tasks", "check:types"]

[tasks."check:network"]
description = "Run the checks that download vulnerability data (pre-push)"
depends = ["check:vuln"]

[tasks."check:actions"]
alias = "ca"
description = "Lint and audit GitHub Actions workflows offline (jactionlint + shellcheck)"
run = "jactionlint --profile pedantic"

[tasks."check:actions:online"]
description = "Audit GitHub Actions workflows online for impostor commits and advisories"
run = "jactionlint --online=strict --strict-exit"

[tasks."check:deps"]
alias = "cd"
description = "Find missing, unused, transitive, and misplaced dependencies (deptry)"
run = "uv run --locked --extra mcp deptry ."

[tasks."check:format"]
alias = "cf"
description = "Check formatting, project metadata, and lockfile"
run = [
  "uv run --locked --extra mcp validate-pyproject pyproject.toml",
  "uv run --locked --extra mcp ruff format --check src tests",
  "uv lock --check",
  "dprint check",
]

[tasks."check:leaks"]
alias = "cs"
description = "Scan working-tree files, including untracked files, for leaked secrets (betterleaks)"
# betterleaks 1.10+ loads .betterleaks.toml only when named explicitly.
run = "betterleaks dir . --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:leaks:full"]
description = "Scan the complete Git history for leaked secrets (weekly in security.yml; needs a full clone)"
run = "betterleaks git --config .betterleaks.toml --redact=100 --verbose --no-banner"

[tasks."check:lint"]
alias = "cl"
description = "Lint Python sources and tests (ruff)"
run = "uv run --locked --extra mcp ruff check src tests"

[tasks."check:tasks"]
description = "Validate the mise task graph and Lefthook configuration"
run = ["mise tasks validate", "lefthook validate"]

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources and tests (ty)"
run = "uv run --locked --extra mcp ty check src tests"

[tasks."check:vuln"]
alias = "cv"
description = "Audit locked Python dependencies for known vulnerabilities (uv audit)"
run = "uv audit --preview-features audit-command --locked"

[tasks.clean]
alias = "n"
description = "Remove build artifacts, caches, and coverage files"
run = "rm -rf .pytest_cache .ruff_cache .ty_cache .coverage .coverage.* dist"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = ["format:dprint", "format:python"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, and YAML with dprint, or only the given files"
run = "dprint fmt --allow-no-files"

# Lefthook passes staged files; mise hands variadic arguments over as one shell-quoted
# string, which `eval "set -- ..."` splits back safely. Without files, Ruff formats the project.
[tasks."format:python"]
description = "Sort imports and format Python sources, or only the given files"
usage = 'arg "[files]..." default="."'
run = '''
set -eu
eval "set -- ${usage_files:-}"
uv run --locked --extra mcp ruff check --select=I --fix --force-exclude -- "$@"
uv run --locked --extra mcp ruff format --force-exclude -- "$@"
'''

[tasks.install]
alias = "i"
description = "Sync the locked environment, refusing packages with known malware advisories, and install git hooks"
run = [
  "UV_MALWARE_CHECK=1 uv sync --all-groups --all-extras --locked --preview-features malware-check",
  "lefthook install",
]

[tasks."report:coverage"]
description = "Show per-file coverage from the last test run without rerunning tests"
run = "uv run --locked --extra mcp coverage report"

[tasks.smoke]
description = "Exercise every command against the live site (network-dependent, not a merge gate)"
run = "uv run --locked --extra mcp python -m tests.smoke"

[tasks.test]
alias = "t"
description = "Run the offline pytest suite with branch coverage"
env.TZ = "UTC"
# Positive fail_under in pyproject.toml preserves the total and coverage gate.
run = "uv run --locked --extra mcp pytest -q --cov --cov-report="

[tasks.upgrade]
alias = "u"
description = "Upgrade dependencies to latest compatible versions, refusing known malware"
run = "UV_MALWARE_CHECK=1 uv sync --all-groups --all-extras --upgrade --preview-features malware-check"
