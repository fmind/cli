# https://mise.jdx.dev/configuration.html
[settings.task]
run_auto_install = false

[tools]
"aqua:astral-sh/uv" = "0.12.17"
actionlint = "1.7.12"
dprint = "0.57.4"
gitleaks = "8.30.1"
lefthook = "2.1.14"
python = "3.14.7"
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tasks.all]
alias = "a"
description = "Format, check, test, and build — the single gate shared by hooks and CI"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build the wheel and source distribution"
run = "uv build --clear"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:actions", "check:format", "check:leaks", "check:lint", "check:types", "check:vuln"]

[tasks."check:actions"]
description = "Lint and audit GitHub Actions workflows (actionlint + zizmor)"
run = ["actionlint", "zizmor --offline .github/"]

[tasks."check:format"]
alias = "cf"
description = "Check formatting and the lockfile"
run = ["uv lock --check", "uv run --locked --extra mcp ruff format --check src tests", "dprint check"]

[tasks."check:leaks"]
alias = "cs"
description = "Audit recent commits and the working tree for leaked secrets (gitleaks)"
run = [
  'gitleaks git --redact=100 --log-opts="--max-count=100" --verbose',
  "gitleaks dir . --redact=100 --verbose",
]

[tasks."check:lint"]
alias = "cl"
description = "Lint Python sources (ruff)"
run = "uv run --locked --extra mcp ruff check src tests"

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run --locked --extra mcp ty check src"

[tasks."check:vuln"]
description = "Audit locked Python dependencies for known vulnerabilities"
run = "uv audit --locked --preview-features audit-command"

[tasks.clean]
description = "Remove build artifacts, caches, and coverage files"
run = "rm -rf .coverage .pytest_cache/ .ruff_cache/ .ty_cache/ dist/ htmlcov/"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
run = [
  "uv run --locked --extra mcp ruff check --select I --fix src tests",
  "uv run --locked --extra mcp ruff format src tests",
  "dprint fmt",
]

[tasks.install]
alias = "i"
description = "Sync the locked environment and install git hooks"
run = ["uv sync --all-groups --all-extras --frozen", "lefthook install"]

[tasks.smoke]
description = "Exercise every command against the live site (network-dependent, not a merge gate)"
run = "uv run --locked --extra mcp python -m tests.smoke"

[tasks.test]
alias = "t"
description = "Run the offline pytest suite with branch coverage"
run = "uv run --locked --extra mcp pytest"
