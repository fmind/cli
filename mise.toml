# Docs: https://mise.jdx.dev/configuration.html
[settings.task]
run_auto_install = false

[tools]
"aqua:astral-sh/uv" = "0.13.6"
betterleaks = "1.9.0"
dprint = "0.64.3"
jactionlint = "2.4.0"
lefthook = "2.2.2"
python = "3.14.10"
shellcheck = "0.11.0"

[tasks.all]
alias = "a"
description = "Format, check, test, and build — the single gate shared by hooks and CI"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.build]
alias = "b"
description = "Build the wheel and source distribution"
run = "uv build --clear"

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = ["check:local", "check:network"]

[tasks."check:local"]
description = "Run the static checks that need no network (pre-commit)"
depends = ["check:actions", "check:format", "check:leaks", "check:lint", "check:types"]

[tasks."check:network"]
description = "Run the checks that download vulnerability data (pre-push)"
depends = ["check:vuln"]

[tasks."check:actions"]
description = "Lint and audit GitHub Actions workflows (jactionlint)"
run = "jactionlint"

[tasks."check:format"]
alias = "cf"
description = "Check formatting and the lockfile"
run = ["uv lock --check", "uv run --locked --extra mcp ruff format --check src tests", "dprint check"]

[tasks."check:leaks"]
alias = "cs"
description = "Scan the last 100 commits and the staged changes for leaked secrets (betterleaks)"
# The staged scan covers what the next commit adds without reading ignored caches,
# which copy the synthetic credentials of the tests.
run = [
  'betterleaks git --redact=100 --log-opts="--max-count=100" --verbose --no-banner',
  "betterleaks git --staged --redact=100 --verbose --no-banner",
]

[tasks."check:leaks:full"]
description = "Scan the complete Git history for leaked secrets (weekly in security.yml; needs a full clone)"
run = "betterleaks git --redact=100 --verbose --no-banner"

[tasks."check:lint"]
alias = "cl"
description = "Lint Python sources (ruff)"
run = "uv run --locked --extra mcp ruff check src tests"

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources and tests (ty)"
run = "uv run --locked --extra mcp ty check src tests"

[tasks."check:vuln"]
description = "Audit locked Python dependencies for known vulnerabilities"
run = "uv audit --locked --preview-features audit-command"

[tasks.clean]
description = "Remove build artifacts, caches, and coverage files"
run = "rm -rf .coverage .pytest_cache/ .ruff_cache/ .ty_cache/ dist/ htmlcov/"

[tasks.format]
alias = "f"
description = "Format all sources and documents"
depends = ["format:dprint", "format:python"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, and YAML with dprint, or only the given files"
run = "dprint fmt --allow-no-files"

# Lefthook passes staged files; mise hands variadic arguments over as one shell-quoted
# string, which `eval "set -- ..."` splits back safely. Without files, Ruff formats the project.
[tasks."format:python"]
description = "Sort imports and format Python sources, or only the given files"
usage = 'arg "[files]..."'
run = '''
eval "set -- $usage_files"
uv run --locked --extra mcp ruff check --select I --fix --force-exclude "$@"
uv run --locked --extra mcp ruff format --force-exclude "$@"
'''

[tasks.install]
alias = "i"
description = "Sync the locked environment and install git hooks"
run = ["uv sync --all-groups --all-extras --locked", "lefthook install"]

[tasks.smoke]
description = "Exercise every command against the live site (network-dependent, not a merge gate)"
run = "uv run --locked --extra mcp python -m tests.smoke"

[tasks.test]
alias = "t"
description = "Run the offline pytest suite with branch coverage"
run = "uv run --locked --extra mcp pytest"
