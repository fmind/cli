# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax
name: Set up mise
description: Install the pinned mise and the locked tools one job needs
inputs:
  tools:
    description: Space-separated tools to install; empty installs every tool in mise.toml
    default: ""
  cache:
    description: Read the shared tool cache; pass "false" in release build jobs
    default: "true"
runs:
  using: composite
  steps:
    - name: Install mise and locked tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.4 # pinned mise; bump deliberately with mise.lock tooling
        # Fail on a tool that mise.lock does not pin instead of resolving it live.
        install_args: --locked ${{ inputs.tools }}
        cache: ${{ inputs.cache }}
        # Only the full install (the CI gate) writes the cache, so a partial tool
        # set never replaces the complete one the other jobs read.
        cache_save: ${{ inputs.tools == '' }}
        # Key tools on the lockfile only: task edits in mise.toml must not force fresh
        # GitHub downloads (a 2026-11-08 release-asset outage blocked runs that way).
        cache_key: "{{cache_key_prefix}}-{{platform}}-{{version}}-p{{cache_period}}-${{ hashFiles('mise.lock') }}"
