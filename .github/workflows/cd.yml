# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CD
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    name: CI
    # The gate, the Python compatibility matrix, and the dependency floors back the
    # published promises, so the tagged commit passes all of them before publishing.
    # A job-level call already runs the caller's tagged commit, so `./` is that code.
    # jactionlint ignore=self-repository
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned build tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv python
          cache: false
      - name: Verify release version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag must match pyproject.toml version v$version" >&2
            exit 1
          fi
      - name: Verify live website commands
        run: mise run smoke
      - name: Build distributions
        run: mise run build
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing exchanges this for a short-lived PyPI token
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
