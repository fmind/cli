# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CD
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    name: CI
    # The gate, the Python compatibility matrix, and the dependency floors back the
    # published promises, so the tagged commit passes all of them before publishing.
    # A job-level call already runs the caller's tagged commit, so `./` is that code.
    # jactionlint ignore=self-repository
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned build tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv python
          cache: false
      - name: Verify release version and changelog
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag must match pyproject.toml version v$version" >&2
            exit 1
          fi
          awk -v head="## [$version]" 'index($0, head) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md must contain a non-empty ## [$version] section" >&2
            exit 1
          fi
      - name: Verify live website commands
        run: mise run smoke
      - name: Build distributions
        run: mise run build
      - name: Record distribution hashes
        run: sha256sum dist/*.whl dist/*.tar.gz > python-package.sha256
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            python-package.sha256
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fmind
    permissions:
      contents: read
      id-token: write # Authenticate provenance and PyPI Trusted Publishing
      attestations: write # Publish provenance for the tested distributions
      artifact-metadata: write # Associate provenance with repository artifacts
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
      - name: Verify distribution hashes
        run: sha256sum --check --strict python-package.sha256
      - name: Verify distribution count
        run: test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
  release:
    name: Publish GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Publish the GitHub release after PyPI succeeds
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
      - name: Verify distribution hashes
        run: sha256sum --check --strict python-package.sha256
      - name: Extract release notes
        run: |
          awk -v head="## [${GITHUB_REF_NAME#v}]" 'index($0, head) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
