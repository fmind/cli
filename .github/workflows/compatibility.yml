# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Website compatibility
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-compatibility
  cancel-in-progress: false
jobs:
  smoke:
    name: Live API and MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise system
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: Verify live website compatibility
        run: mise run smoke
