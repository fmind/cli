# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # CD runs these jobs on the tagged commit before publishing
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A literal prefix: when CD calls this workflow, github.workflow names the caller,
  # and sharing its group would cancel or block the release run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  gate:
    name: Canonical gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100 # check:leaks scans the last 100 commits; a shallower clone hides them
          persist-credentials: false # no step pushes back to the repository
      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
      - name: Run canonical gate
        run: mise run all
      - name: Verify no changes
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
  compat:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The gate covers the pinned interpreter; a pin bump must move the old pin here.
        python: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv
      # The gate runs on the pinned interpreter; this proves the `requires-python` range
      # the published wheel advertises, from its floor to the newest release.
      - name: Run the test suite
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv run --locked --all-groups --all-extras --python "$PYTHON_VERSION" pytest
  lowest:
    name: Lowest direct dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv
      # The published wheel promises these floors; the lockfile only proves the latest
      # versions. Re-resolving rewrites uv.lock on this throwaway runner only.
      - name: Run the test suite at the declared lower bounds
        run: uv run --resolution lowest-direct --all-groups --all-extras --python 3.14 pytest
