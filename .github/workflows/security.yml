# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
# Push CI scans only the working tree, so a secret committed earlier and later
# removed would never be seen again. This is the full-history counterpart: same
# pinned scanners, whole history, no report to parse — a finding fails the job.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history and dependency scan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the scanner only reads the checkout
      - name: Set up security scanners
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:astral-sh/uv betterleaks jactionlint shellcheck
      - name: Scan complete Git history
        run: mise run check:leaks:full
      - name: Audit locked dependencies
        # Each scan is independent: a failed scan must not skip the remaining checks.
        if: ${{ !cancelled() }}
        run: mise run check:network
      - name: Audit workflows online
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run check:actions:online
