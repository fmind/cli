# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
# CI scans only the latest commits, so a secret committed earlier and later removed
# would never be seen again. This is the full-history counterpart: same pinned
# scanner, whole history, no report to parse — a finding fails the job.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history and dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the scanner only reads the checkout
      - name: Install mise system
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4 # pinned mise; bump deliberately with mise.lock tooling
      - name: Scan complete Git history
        run: mise run check:leaks:full
      - name: Audit locked dependencies
        run: mise run check:vuln
