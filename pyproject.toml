# Docs: https://packaging.python.org/en/latest/specifications/pyproject-toml/
[project]
name = "fmind"
version = "3.0.2"
description = "Read Médéric Hurier's (Fmind) portfolio and daily news from the terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Médéric Hurier" }]
requires-python = ">=3.14"
keywords = ["portfolio", "cli", "fmind", "resume", "articles", "news", "mcp"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Utilities",
]
dependencies = ["typer>=0.26", "rich>=13.9"]

[project.urls]
Homepage = "https://www.fmind.dev/"
Repository = "https://github.com/fmind/cli"
Changelog = "https://github.com/fmind/cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/fmind/cli/issues"
Security = "https://github.com/fmind/cli/security/policy"

[project.scripts]
fmind = "fmind.cli:app"

[project.optional-dependencies]
mcp = [
  "httpx2>=2.12,<3",
  "mcp>=2.2,<3",
  "mcp-types>=2.2,<3",
]

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "markdown-it-py>=4.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-socket>=0.8.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.17.5",
  "ty>=0.0.107,<0.1",
  "validate-pyproject>=0.27",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fmind"
module-root = "src"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"] # dprint owns Markdown, including its Python blocks

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FURB",
  "I",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PLE",
  "PLW",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TID",
  "UP",
  "W",
]

[tool.ruff.lint.flake8-tidy-imports]
# Portfolio commands run without the optional `mcp` extra; only the bridge loads it.
banned-module-level-imports = ["fmind.mcp", "httpx2", "mcp", "mcp_types"]

[tool.ruff.lint.per-file-ignores]
"src/fmind/mcp.py" = ["TID253"] # the bridge is the extra's only importer
"tests/**" = ["S101", "SLF001", "T201", "TID253"] # tests assert, inspect layer internals, and install every extra

[tool.deptry]
known_first_party = ["fmind"]

[tool.ty.rules]
blanket-ignore-comment = "error"

[tool.pytest]
testpaths = ["tests"]
# Offline by default: tests reach only loopback and Unix sockets.
addopts = ["-ra", "--allow-hosts=127.0.0.1,::1", "--allow-unix-socket"]
filterwarnings = ["error"]
strict = true
timeout = "60"

[tool.coverage.run]
branch = true
source = ["fmind"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = ["if __name__ == .__main__.:"]
